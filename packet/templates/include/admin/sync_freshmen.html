<div class="modal fade" id="sync-freshmen-modal" tabindex="-1" role="dialog" aria-labelledby="sync-freshmen-modal-label"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="sync-freshmen-modal-label">Sync Freshmen</h5>
                <button type="button" class="btn btn-close" data-bs-dismiss="modal" aria-label="Close">
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <input type="file" class="form-control" id="currentFroshFile" accept=".csv, .txt" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" id="sync-freshmen" class="btn btn-primary">Sync Freshmen</button>
            </div>
        </div>
    </div>
</div>
